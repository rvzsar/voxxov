[package]
name = "voxxov"
description = "Voxxov: portable voice-to-text desktop app using GigaAM-V3 (sherpa-onnx)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "voxxov"

[lib]
name = "voxxov_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxxov"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# ONNX / ASR (sherpa-onnx)
sherpa-onnx = { workspace = true }

# HTTP client (для скачивания моделей + yt-dlp/ffmpeg auto-install)
reqwest = { workspace = true }

# zip extraction (для ffmpeg auto-download)
zip = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }

[features]
# По умолчанию включаем custom-protocol для релизной сборки
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
