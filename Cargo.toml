[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-only"
repository = "https://github.com/rvzsar/voxxov"
authors = ["Voxxov contributors"]

[workspace.dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Async runtime — features trimmed to what we actually use.
# (was ["full"] which pulled in net, signal, time, etc. — all unused.)
tokio = { version = "1", features = [
    "rt-multi-thread",  # tauri::async_runtime::spawn on multiple threads
    "macros",           # tokio::select!
    "sync",             # broadcast, OnceCell, Mutex
    "fs",               # tokio::fs::* in commands::scan_folder
    "io-util",          # AsyncBufReadExt, BufReader in ffmpeg
    "process",          # tokio::process::Command for ffmpeg/yt-dlp
] }
tokio-util = "0.7"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Config & paths
# (data-root resolved via std::env::current_exe() — no third-party path crate)

# Errors & logging
thiserror = "1"
tracing = "0.1"
# json feature removed: we use plain fmt, not JSON-formatted logs.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ONNX / ASR (sherpa-onnx — native C, static linking)
sherpa-onnx = { version = "1.13.2", default-features = false, features = ["static"] }

# HTTP client для скачивания моделей с GitHub Releases + yt-dlp/ffmpeg auto-install.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# zip extraction (для ffmpeg auto-download из BtbN's Windows builds).
zip = { version = "2", default-features = false, features = ["deflate"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
once_cell = "1"
parking_lot = "0.12"
sha2 = "0.10"
# Faster global allocator than the MSVC default (alloc-heavy paths:
# per-chunk token vectors, yt-dlp stderr parsing). See
# https://github.com/microsoft/mimalloc
mimalloc = "0.1"
# Hardware detection (cores, CPU, RAM) for adaptive ASR parameters.
sysinfo = "0.39"

# (lofty patch removed — was only needed for the old yt-dlp crate
#  which depended on a yanked 0.23.x. With subprocess yt-dlp gone.)

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
