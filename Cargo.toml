[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-only"
repository = "https://github.com/your-org/gigaam-desktop"
authors = ["GigaAM Desktop contributors"]

[workspace.dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Config & paths
directories = "5"
config = { version = "0.14", default-features = false, features = ["toml"] }

# Errors & logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# ONNX Runtime (sherpa-onnx — native C, static linking)
sherpa-onnx = { version = "1.13.2", default-features = false, features = ["static"] }
hound = "3.5"

# yt-dlp wrapper (auto-installs yt-dlp + ffmpeg, GPL-3.0)
yt-dlp = { version = "2.7.2", default-features = false, features = ["cache-redb", "rustls"] }

# CLI & progress
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"

# Database (для истории распознаваний, Sprint 4)
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
