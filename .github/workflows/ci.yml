name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-types:
    name: Frontend type-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install + svelte-check
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check

  build-windows:
    name: Build (windows-msvc, portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: windows-x86_64-msvc

      # tauri.conf.json sets `beforeBuildCommand: npm run build`, which
      # tauri-action runs automatically. `npm ci` must run first so
      # node_modules exists when the frontend builds.
      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      # `--no-bundle` → just the raw .exe (no NSIS/MSI installer).
      # Combined with `+crt-static` from .cargo/config.toml, the .exe
      # needs only WebView2 runtime (preinstalled on Win 11) — no VC++
      # Redist, no installer, copy-anywhere portable.
      - name: Build portable .exe (debug)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --debug --target x86_64-pc-windows-msvc --no-bundle

      # Cargo workspace puts target/ at the repo root, not inside the
      # crate, so the path is `target/...` (not `apps/desktop/src-tauri/target/...`).
      - name: Upload portable .exe
        uses: actions/upload-artifact@v4
        with:
          name: voxxov-windows-msvc-portable
          path: target/x86_64-pc-windows-msvc/debug/voxxov.exe
          if-no-files-found: error
          retention-days: 14
