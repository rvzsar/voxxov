name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-types:
    name: Frontend type-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install + svelte-check
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check

  build-windows:
    name: Build (windows-msvc, debug)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: windows-x86_64-msvc

      # tauri.conf.json sets `beforeBuildCommand: npm run build`, which
      # tauri-action runs automatically. `npm ci` must run first so
      # node_modules exists when the frontend builds.
      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Tauri bundle (debug)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # NSIS only: skips the WiX/MSI download, faster & more reliable
          # in CI. Release workflow builds both via `targets: "all"`.
          args: --debug --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload Windows msvc debug bundle
        uses: actions/upload-artifact@v4
        with:
          name: gigaam-desktop-windows-msvc-debug
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/debug/bundle/**
          if-no-files-found: warn
          retention-days: 14
