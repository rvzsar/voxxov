name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (windows-x86_64, portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: windows-x86_64-msvc

      # `--no-bundle` → single portable .exe (no NSIS/MSI installer).
      # `+crt-static` from .cargo/config.toml → no VC++ Redist needed.
      # No tagName here: tauri-action only builds; softprops below
      # creates the release and attaches the .exe.
      - name: Build portable .exe
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target x86_64-pc-windows-msvc --no-bundle

      - name: Create release and upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GigaAM Desktop ${{ github.ref_name }}
          body: |
            Portable Windows build.

            - Single .exe, no installer
            - Requires WebView2 Runtime (preinstalled on Windows 11; on
              Windows 10 install from https://developer.microsoft.com/microsoft-edge/webview2/)
            - No Visual C++ Redistributable required
          draft: true
          prerelease: false
          files: target/x86_64-pc-windows-msvc/release/gigaam-desktop.exe
          fail_on_unmatched_files: true
