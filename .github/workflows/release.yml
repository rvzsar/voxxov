name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # These are Tauri **updater** signing keys (signs the .sig files
  # that the in-app updater verifies). They are NOT OS-level code
  # signing certs (Apple Developer ID, Windows Authenticode, etc.) —
  # for proper code signing, configure those separately via the
  # platform's signing tools, not via these env vars.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    name: Build (${{ matrix.platform.label }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            label: macos-aarch64
          - runner: macos-13
            target: x86_64-apple-darwin
            label: macos-x86_64

    steps:
      - uses: actions/checkout@v4

      # Diagnostics for macos runners — `macos-latest` is a floating
      # alias; logging uname keeps surprises visible if it changes.
      - name: Show host
        if: startsWith(matrix.platform.runner, 'macos')
        run: |
          uname -a
          uname -m

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform.runner == 'windows-latest'
        with:
          arch: x64

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.platform.label }}

      - name: Install system deps (Linux)
        if: matrix.platform.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      # tauri.conf.json has `beforeBuildCommand: npm run build`, so
      # tauri-action triggers it. No need for a separate `npm run build`
      # step here — that would build the frontend twice.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: GigaAM Desktop ${{ github.ref_name }}
          releaseBody: "See the assets below for download links."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.platform.target }}
