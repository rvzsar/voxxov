name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # These are Tauri **updater** signing keys (signs the .sig files
  # that the in-app updater verifies). They are NOT OS-level code
  # signing certs (Apple Developer ID, Windows Authenticode, etc.) —
  # for proper code signing, configure those separately via the
  # platform's signing tools, not via these env vars.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    name: Build (windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: windows-x86_64-msvc

      # tauri.conf.json sets `beforeBuildCommand: npm run build`, which
      # tauri-action runs automatically. `npm ci` above must run first to
      # populate node_modules.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: GigaAM Desktop ${{ github.ref_name }}
          releaseBody: "See the assets below for download links."
          releaseDraft: true
          prerelease: false
          # Default `targets: "all"` from tauri.conf.json gives us both
          # NSIS and MSI installers. Static CRT (from .cargo/config.toml)
          # means the .exe doesn't need VC++ Redistributable.
          args: --target x86_64-pc-windows-msvc
